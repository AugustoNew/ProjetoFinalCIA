services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendaki
      POSTGRES_PASSWORD: agendaki_dev
      POSTGRES_DB: agendaki
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/10-create-e2e.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendaki -d agendaki"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: